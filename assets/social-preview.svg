<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Human-in-the-Loop AI Role Monitor</title>
  <desc id="desc">A portfolio preview showing public ATS feeds flowing through discovery, scoring, human review, and verified handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#102F43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1160" cy="74" r="260" fill="#1D4E70" opacity=".22"/>
  <circle cx="110" cy="600" r="250" fill="#0F766E" opacity=".16"/>
  <rect x="68" y="65" width="10" height="108" rx="5" fill="url(#accent)"/>
  <text x="102" y="103" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">AI AUTOMATION PORTFOLIO</text>
  <text x="102" y="151" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Human-in-the-Loop</text>
  <text x="102" y="201" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">AI Role Monitor</text>
  <text x="102" y="244" fill="#B9D3E6" font-family="Arial, Helvetica, sans-serif" font-size="22">Public ATS discovery · Explainable scoring · Verified handoff</text>
  <g filter="url(#shadow)">
    <rect x="82" y="337" width="220" height="136" rx="16" fill="#12324A" stroke="#327091" stroke-width="2"/>
    <rect x="349" y="337" width="220" height="136" rx="16" fill="#12324A" stroke="#327091" stroke-width="2"/>
    <rect x="616" y="337" width="220" height="136" rx="16" fill="#163C4A" stroke="#2AAE9A" stroke-width="2"/>
    <rect x="883" y="337" width="270" height="136" rx="16" fill="#12324A" stroke="#60A5FA" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#77B9D6" stroke-width="4" stroke-linecap="round"><path d="M302 405H349"/><path d="M569 405H616"/><path d="M836 405H883"/></g>
  <g fill="#77B9D6"><path d="M340 397l13 8-13 8z"/><path d="M607 397l13 8-13 8z"/><path d="M874 397l13 8-13 8z"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="107" y="376" fill="#2DD4BF" font-size="17" font-weight="700" letter-spacing="1.5">01 / DISCOVER</text>
    <text x="107" y="415" fill="#F8FAFC" font-size="23" font-weight="700">Public ATS feeds</text>
    <text x="107" y="446" fill="#B9D3E6" font-size="17">6 native adapters</text>
    <text x="374" y="376" fill="#7DD3FC" font-size="17" font-weight="700" letter-spacing="1.5">02 / EVALUATE</text>
    <text x="374" y="415" fill="#F8FAFC" font-size="23" font-weight="700">Score + dedupe</text>
    <text x="374" y="446" fill="#B9D3E6" font-size="17">SQLite decision state</text>
    <text x="641" y="376" fill="#5EEAD4" font-size="17" font-weight="700" letter-spacing="1.5">03 / REVIEW</text>
    <text x="641" y="415" fill="#F8FAFC" font-size="23" font-weight="700">Human decides</text>
    <text x="641" y="446" fill="#B9D3E6" font-size="17">Approve · reject · defer</text>
    <text x="908" y="376" fill="#93C5FD" font-size="17" font-weight="700" letter-spacing="1.5">04 / VERIFY</text>
    <text x="908" y="415" fill="#F8FAFC" font-size="23" font-weight="700">Safe handoff</text>
    <text x="908" y="446" fill="#B9D3E6" font-size="17">Exact receipt required</text>
  </g>
  <line x1="82" y1="530" x2="1153" y2="530" stroke="#4A7890" stroke-opacity=".65"/>
  <text x="82" y="573" fill="#D5E6F2" font-family="Arial, Helvetica, sans-serif" font-size="21">Reliable automation keeps people in control of consequential decisions.</text>
  <text x="82" y="610" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">PYTHON  •  SQLITE  •  CONCURRENCY  •  AUDITABLE WORKFLOWS</text>
</svg>
